[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "equivtest"
version = "0.2.0"
description = "Equivalence testing and power analysis for comparing machine-learning methods by AUROC"
authors = [{ name = "Dmytro Knopov" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools]
packages = ["equivtest"]
